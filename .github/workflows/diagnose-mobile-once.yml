name: Diagnose Mobile Dynamics
on:
  push:
    branches:
      - feat/mobile-dynamics-single-tab-social-run
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show all Biome diagnostics
        run: pnpm exec biome check --max-diagnostics=250 .
