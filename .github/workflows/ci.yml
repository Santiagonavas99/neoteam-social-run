name: CI

# Validates pull requests into main that are ready for review (drafts skip).
# main itself only receives merged, already validated pull requests. A new push
# to the same pull request cancels the run still going for the previous one.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app:
    if: ${{ !github.event.pull_request.draft }}
    name: Lint + Typecheck + Tests + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm ci:check

  db:
    if: ${{ !github.event.pull_request.draft }}
    name: SQL tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run supabase/tests against supabase/postgres
        run: bash scripts/test-db.sh

      - name: Stop database
        if: always()
        run: docker compose down -v
