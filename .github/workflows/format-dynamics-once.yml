name: Format Social Run dynamics branch
on:
  push:
    branches:
      - feat/mobile-dynamics-single-tab-social-run

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Biome safe formatting fixes
        run: pnpm exec biome check --write .
      - name: Commit formatting changes on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "style(dynamics): apply Biome formatting and lint fixes"
            git push origin HEAD:feat/mobile-dynamics-single-tab-social-run
          fi
