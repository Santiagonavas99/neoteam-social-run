name: Format Mobile Public Screen
on:
  push:
    branches:
      - fix/dynamics-mobile-public-screen-same-tab

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed components
        run: pnpm exec biome format --write features/admin/dynamics/dynamics-view.tsx features/admin/dynamics/game-control-panel.tsx
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/admin/dynamics/dynamics-view.tsx features/admin/dynamics/game-control-panel.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(dynamics): format in-tab mobile spectator view"
            git push origin HEAD:fix/dynamics-mobile-public-screen-same-tab
          fi
