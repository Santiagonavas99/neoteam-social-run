name: Format Dynamics Mobile Editor
on:
  push:
    branches:
      - feat/mobile-dynamics-single-tab-social-run

permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format just the mobile dynamics editor
        run: pnpm exec biome format --write features/admin/dynamics/dynamic-form.tsx
      - name: Commit formatter fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/admin/dynamics/dynamic-form.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(dynamics): format compact mobile editor"
            git push origin HEAD:feat/mobile-dynamics-single-tab-social-run
          fi
