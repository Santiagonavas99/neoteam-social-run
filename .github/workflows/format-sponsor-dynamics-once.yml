name: Format Sponsor Dynamics Fix Once
on:
  push:
    branches:
      - feat/dynamics-mobile-one-action
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome safe formatting on affected files
        run: |
          pnpm exec biome check --write features/admin/dynamics/draw-result.tsx features/admin/dynamics/dynamic-form.tsx features/admin/dynamics/event-draw-mode.test.ts features/admin/dynamics/event-draw-mode.ts features/admin/dynamics/mobile-dynamic-operator.tsx features/admin/dynamics/mobile-dynamics-home.tsx features/admin/dynamics/dynamics-view.tsx || true
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/admin/dynamics/
          if ! git diff --cached --quiet; then
            git commit -m "style(dynamics): format unified sponsor raffle interface"
            git push origin HEAD:feat/dynamics-mobile-one-action
          fi
